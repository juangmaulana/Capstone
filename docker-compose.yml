version: '3.8'

services:
  postgres-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: juangmaulana
      POSTGRES_PASSWORD: SecretCAPS12
      POSTGRES_DB: capstone2
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  web-app:
    build: ./FE
    ports:
      - "127.0.0.1:3000:3000"
      # - "3000:3000"
    env_file:
      - ./FE/.env
    depends_on:
      - postgres-db
      - ai-service
    restart: always

  ai-service:
    build: ./AI
    ports:
      - "127.0.0.1:7860:7860"
    restart: always

volumes:
  pgdata:
